api-version: '1.21'
name: TTT
version: '1.0.0'
main: tsd.ttt.TTT
description: Track Trace Trigger - config-driven custom content engine.
authors:
  - Peach Tree Studios
folia-supported: true
commands:
  ttt:
    description: Opens TTT main panel and provides admin subcommands.
    usage: /ttt
    aliases: [bullseye]
    permission: ttt.admin
permissions:
  ttt.admin:
    description: Access TTT administration commands.
    default: op
  ttt.browser:
    description: Receive items, spawn mobs, and place spawners from the TTT browser.
    default: op
dependencies:
  server:
    MythicMobs:
      load: BEFORE
      required: false
      join-classpath: true
    ModelEngine:
      load: BEFORE
      required: false
      join-classpath: true
    ModelEngineR4:
      load: BEFORE
      required: false
      join-classpath: true
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    TAB:
      load: BEFORE
      required: false
      join-classpath: true
    WorldEdit:
      load: BEFORE
      required: false
      join-classpath: true
    WorldGuard:
      load: BEFORE
      required: false
      join-classpath: true
    MMOItems:
      load: BEFORE
      required: false
      join-classpath: true
    Nexo:
      load: BEFORE
      required: false
      join-classpath: true
    Oraxen:
      load: BEFORE
      required: false
      join-classpath: true
    ChampionAllies:
      load: BEFORE
      required: false
      join-classpath: true
