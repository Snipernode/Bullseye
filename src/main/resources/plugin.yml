name: TTT
main: tsd.ttt.TTT
version: 1.0.0
api-version: '1.21'
author: Snipernode
description: Track Trace Trigger - config-driven custom content engine for Paper and Spigot servers.
website: https://example.com/ttt
softdepend: [MythicMobs, ModelEngine, ModelEngineR4, PlaceholderAPI, TAB, WorldEdit, WorldGuard, MMOItems, Nexo, Oraxen, ChampionAllies]

commands:
  ttt:
    description: Opens TTT main panel and provides admin subcommands.
    usage: /ttt
    aliases: [bullseye]
    permission: ttt.admin

permissions:
  ttt.admin:
    description: Access TTT administration commands.
    default: op
  ttt.browser:
    description: Receive items, spawn mobs, and place spawners from the TTT browser.
    default: op
